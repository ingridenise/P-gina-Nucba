<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <main>
        <section>
            <h1>Formulario de registro</h1>
            <form>
                <label for="name">Nombre</label>
            <input type="text" id="name">
            <br><br>
            <label for="lastname">Apellido</label>
            <input type="text" id="lastname">
            <br><br>
            <span>Modalidad de cursada:</span>
            <input type="radio" id="ondemand" name="cursar">
            <label for="ondemand">On-Demand</label>
            <input type="radio" id="vivo" name="cursar">
            <label for="vivo">En vivo </label>
            <br> <br>
            <label for="email">Correo</label>
            <input type="email" id="email">
            <br> <br>
            <input type="checkbox" id="info">
            <label for="info">Deseo recibir información sobre los nuevos posteos en la plataforma de Nucba</label>
            <br> <br>
            <input type="checkbox" id="declaro">
            <label for="declaro">Declaro que leí los términos y condiciones y estoy listo para convertirme en un Full-stack</label>
            <br><br>
            <input type="submit" name="" id="">
            
            </form>
        </section>
    </main>
</body>
</html>
