<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card-Messi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="Card-Messi">
        <div class="card-header">
            <img src="./Messi.jpg" alt="messi">
            <h2>Lionel Messi</h2>
        </div>
        <div class="card-body">
            <div class="info">
                <h3>Información Personal</h3>
                <p>Edad: 35 Años</p>
                <p>Nacionalidad: Argentina</p>
                <p>Posición: Delantero</p>
            </div>
        </div>
        </div>
    </div>
</body>
</html>
